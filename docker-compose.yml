services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codesentry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codesentry
      POSTGRES_PASSWORD: codesentry
      POSTGRES_DB: codesentry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
